name: Slash command on Approve/LGTM
on:
  repository_dispatch:
    types:
      - approved-command
      - approve-command
      - lgtm-command

concurrency:
  group: approve-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: write
  packages: read
  statuses: write
  pull-requests: write

jobs:
  approve:
    name: Approve Pull Request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        id: approval
        env:
          PULL_REQUEST_PARAM: ${{ github.event.client_payload.slash_command.args.named.pull_request }}
          PULL_REQUEST_NUMBER: ${{ github.event.client_payload.slash_command.args.named.pull_request_number }}
          PULL_REQUEST_AUTHOR: ${{ github.event.client_payload.slash_command.args.named.author }}
          ACTION_EVENT_NAME: ${{ github.event_name }}
          ACTION_TF_PATH: ${{ env.tf_actions_working_dir }}
          ACTION_WORKFLOW: ${{ github.workflow }}
        with:
          github-token: ${{secrets.BOT_TOKEN}}
          script: |
            const pull_request = '' + (process.env.PULL_REQUEST_PARAM || '') + '';
            const pull_request_number = '' + (process.env.PULL_REQUEST_NUMBER || '') + '';
            const author = '' + (process.env.PULL_REQUEST_AUTHOR || '') + '';
            const actionEventName = '' + (process.env.ACTION_EVENT_NAME || '') + '';
            const actionTfPath = '' + (process.env.ACTION_TF_PATH || '') + '';
            const actionWorkflow = '' + (process.env.ACTION_WORKFLOW || '') + '';
            
            const {data: thepull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull_request_number
            });

            if ( ! thepull.mergeable ) {
              console.log('NOT Mergeable');
              return "not-mergeable";
            } 

            const output = `Approval Requested for Pull request.
            Pull request mergeable?: \`${thepull.mergeable}\`
            Approved by: \`${author}\`
            
            *Action: \`${actionEventName}\`, Working Directory: \`${actionTfPath}\`, Workflow: \`${actionWorkflow}\`*`;

            const {data: reviewers} = await github.rest.pulls.listRequestedReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull_request_number
            });

            const {data: reviews} = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull_request_number
            });

            var is_approved = false;
            
            for (const aReview of reviews ) {
              if( aReview.user.login == author && aReview.state == 'APPROVED' ) {
                is_approved = true;
                break;
              }
            }
            for (const aUser of reviewers.users ) {
              if( aUser.login == author ) {
                is_approved = true;
                break;
              }
            }

            if ( is_approved ) {
              github.rest.issues.createComment({
                issue_number: pull_request_number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });

              var reviewer_names = [];
              for (const aUser of reviewers.users ) {
                reviewer_names.push(aUser.login);
              }

              // github.rest.pulls.removeRequestedReviewers({
              //   pull_number: pull_request_number,
              //   owner: context.repo.owner,
              //   repo: context.repo.repo,
              //   reviewers: reviewer_names
              // });

              github.rest.issues.removeLabel({
                issue_number: pull_request_number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'approval-required',
              });
              github.rest.issues.removeLabel({
                issue_number: pull_request_number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'review-required'
              });
              github.rest.issues.removeLabel({
                issue_number: pull_request_number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'do-not-merge'
              });
              github.rest.issues.addLabels({
                issue_number: pull_request_number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['approved']
              });
              return 'approved';
            } else {
              return 'not-approved';
            }
            
